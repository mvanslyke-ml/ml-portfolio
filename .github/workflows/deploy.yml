name: Deploy ML Portfolio

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  S3_BUCKET: mvanslyke-ml.com
  MODEL_BUCKET: mvanslyke-ml-models
  
jobs:
  deploy-lambda-functions:
    name: Deploy Lambda Functions
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Install deployment dependencies
      run: |
        pip install boto3 pyyaml --break-system-packages
    
    - name: Deploy all Lambda functions
      run: |
        python scripts/deploy_lambda.py
    
    - name: Update API Gateway
      run: |
        python scripts/update_api_gateway.py
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: lambda-deployment
        path: .build/
        retention-days: 1

  generate-projects:
    name: Generate Projects and Blog Posts
    runs-on: ubuntu-latest
    needs: [deploy-lambda-functions]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Download Lambda deployment artifacts
      uses: actions/download-artifact@v3
      with:
        name: lambda-deployment
        path: .build/
    
    - name: Install dependencies
      run: |
        pip install boto3 pyyaml markdown --break-system-packages
    
    - name: Generate projects.json and blog posts
      run: |
        python scripts/generate_projects.py
    
    - name: Upload website artifacts
      uses: actions/upload-artifact@v4
      with:
        name: website-files
        path: website/
        retention-days: 1

  deploy-website:
    name: Deploy Website to S3
    runs-on: ubuntu-latest
    needs: [generate-projects]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Download website artifacts
      uses: actions/download-artifact@v3
      with:
        name: website-files
        path: website/
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Sync website files to S3
      run: |
        # Upload main website files
        aws s3 sync website/ s3://${{ env.S3_BUCKET }}/ \
          --exclude "blog/*" \
          --delete \
          --cache-control "public,max-age=3600"
        
        # Upload blog posts separately (no delete to preserve old posts)
        aws s3 sync website/blog/ s3://${{ env.S3_BUCKET }}/blog/ \
          --cache-control "public,max-age=86400"
    
    - name: Invalidate CloudFront cache
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/*"
    
    - name: Output URLs
      run: |
        echo "✅ Website deployed to https://mvanslyke-ml.com"
        echo "✅ Blog posts available at https://mvanslyke-ml.com/blog/"
        echo "✅ API available at https://api.mvanslyke-ml.com"
