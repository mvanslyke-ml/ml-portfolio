name: Deploy ML Portfolio

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  S3_BUCKET: mvanslyke-ml.com
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
  
jobs:
  deploy-website:
    name: Deploy Website to S3
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install Python dependencies
      run: |
        pip install boto3 pyyaml markdown beautifulsoup4
    
    - name: Generate projects.json from markdown
      run: |
        python scripts/generate_projects.py
    
    - name: Sync website files to S3
      run: |
        aws s3 sync ./website s3://${{ env.S3_BUCKET }} \
          --delete \
          --exclude ".git/*" \
          --exclude ".gitignore" \
          --cache-control "public,max-age=3600"
    
    - name: Invalidate CloudFront cache
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/*"
    
    - name: Output website URL
      run: echo "✅ Website deployed to https://mvanslyke-ml.com"

  deploy-lambda-functions:
    name: Deploy Lambda Functions
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Install deployment dependencies
      run: |
        pip install boto3 pyyaml
    
    - name: Deploy all Lambda functions
      run: |
        python scripts/deploy_lambda.py
    
    - name: Update API Gateway
      run: |
        python scripts/update_api_gateway.py
    
    - name: Output API URLs
      run: |
        echo "✅ API deployed to https://api.mvanslyke-ml.com"

  update-projects-with-demos:
    name: Update Projects with Lambda Demos
    runs-on: ubuntu-latest
    needs: [deploy-lambda-functions]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Install Python dependencies
      run: |
        pip install boto3 pyyaml markdown beautifulsoup4
    
    - name: Regenerate projects.json with demo URLs
      run: |
        python scripts/generate_projects.py
    
    - name: Upload projects.json to S3
      run: |
        aws s3 cp website/projects.json s3://${{ env.S3_BUCKET }}/projects.json \
          --cache-control "public,max-age=3600"
    
    - name: Invalidate projects.json cache
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/projects.json"
    
    - name: Success message
      run: |
        echo "✅ Projects updated with live demo links"
